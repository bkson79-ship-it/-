<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>롯데마트 포항점 소비기한 관리</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      line-height: 1.45;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 14px;
    }

    .header h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 700;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 17px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 13px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
    }

    input::placeholder, textarea::placeholder {
      color: #64748b;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #60a5fa;
    }

    .photo-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 14px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      padding: 13px 16px;
      font-size: 15px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      flex: 1;
      min-width: 130px;
      background: #334155;
      color: #f8fafc;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    .preview-box {
      margin-top: 10px;
      background: var(--card-2);
      border: 1px dashed #475569;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 8px;
      display: block;
      margin: 0 auto 8px;
      object-fit: contain;
    }

    .preview-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .status-msg {
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
      color: #93c5fd;
    }

    .list-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .list-item img {
      width: 68px;
      height: 68px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .list-content {
      flex: 1;
      min-width: 0;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(37, 99, 235, 0.22);
      color: #93c5fd;
      margin-bottom: 4px;
    }

    .item-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 3px;
      word-break: break-word;
    }

    .item-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .empty-text {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 14px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>롯데마트 포항점 소비기한 관리</h1>
      <p>분류 선택 및 사진 촬영 등록 버전</p>
    </div>

    <div class="card">
      <h2>소비기한 등록</h2>
      <form id="expiryForm">
        <!-- 분류 선택 -->
        <div class="form-group">
          <label for="category">상품 분류</label>
          <select id="category" name="category" required>
            <option value="">분류를 선택하세요</option>
            <option value="냉장">냉장</option>
            <option value="냉동">냉동</option>
            <option value="상온">상온</option>
            <option value="신선/청과·축산·수산">신선/청과·축산·수산</option>
            <option value="베이커리·델리">베이커리·델리</option>
            <option value="생활·기타">생활·기타</option>
          </select>
        </div>

        <!-- 상품 검색 또는 바코드 입력 -->
        <div class="form-group">
          <label for="productQuery">상품명, 상품코드 또는 바코드</label>
          <input
            type="text"
            id="productQuery"
            name="productQuery"
            placeholder="상품명, 상품코드 또는 바코드 입력"
            required
          />
        </div>

        <!-- 입고일 -->
        <div class="form-group">
          <label for="inboundDate">입고일</label>
          <input type="date" id="inboundDate" name="inboundDate" required />
        </div>

        <!-- 소비기한 -->
        <div class="form-group">
          <label for="expiryDate">소비기한</label>
          <input type="date" id="expiryDate" name="expiryDate" required />
        </div>

        <!-- 수량 -->
        <div class="form-group">
          <label for="quantity">수량</label>
          <input type="number" id="quantity" name="quantity" min="1" value="1" required />
        </div>

        <!-- 보관 위치 -->
        <div class="form-group">
          <label for="location">보관 위치</label>
          <input type="text" id="location" name="location" placeholder="예: 냉장 쇼케이스" />
        </div>

        <!-- 사진 촬영 / 앨범 선택 -->
        <div class="form-group">
          <label>소비기한 사진 촬영</label>
          <div class="photo-actions">
            <button type="button" class="btn btn-secondary" id="cameraBtn">
              📷 사진 촬영
            </button>
            <button type="button" class="btn btn-secondary" id="galleryBtn">
              🖼️ 앨범 선택
            </button>
          </div>

          <!-- 후면 카메라 우선 실행 -->
          <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            style="display: none;"
          />
          <!-- 갤러리/파일 선택 -->
          <input
            type="file"
            id="galleryInput"
            accept="image/*"
            style="display: none;"
          />

          <div class="preview-box" id="previewBox" style="display: none;">
            <img id="photoPreview" alt="촬영된 소비기한 사진 미리보기" />
            <div class="preview-meta" id="photoInfo"></div>
            <div style="margin-top: 8px;">
              <button type="button" class="btn-danger" id="removePhotoBtn">사진 삭제</button>
            </div>
          </div>
        </div>

        <!-- 메모 -->
        <div class="form-group">
          <label for="memo">메모</label>
          <input type="text" id="memo" name="memo" placeholder="특이사항" />
        </div>

        <button type="submit" class="btn btn-primary">소비기한 등록</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>

    <div class="card">
      <h2>최근 등록 내역</h2>
      <div id="recordList"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "lotte_pohang_expiry_items_v1";

    const form = document.getElementById("expiryForm");
    const categoryEl = document.getElementById("category");
    const productQueryEl = document.getElementById("productQuery");
    const inboundDateEl = document.getElementById("inboundDate");
    const expiryDateEl = document.getElementById("expiryDate");
    const quantityEl = document.getElementById("quantity");
    const locationEl = document.getElementById("location");
    const memoEl = document.getElementById("memo");

    const cameraBtn = document.getElementById("cameraBtn");
    const galleryBtn = document.getElementById("galleryBtn");
    const cameraInput = document.getElementById("cameraInput");
    const galleryInput = document.getElementById("galleryInput");
    const previewBox = document.getElementById("previewBox");
    const photoPreview = document.getElementById("photoPreview");
    const photoInfo = document.getElementById("photoInfo");
    const removePhotoBtn = document.getElementById("removePhotoBtn");
    const statusMsg = document.getElementById("statusMsg");
    const recordList = document.getElementById("recordList");

    let currentPhotoDataUrl = "";
    let currentPhotoName = "";

    // 오늘 날짜 기본값 설정
    const todayStr = new Date().toISOString().split("T")[0];
    inboundDateEl.value = todayStr;

    cameraBtn.addEventListener("click", () => cameraInput.click());
    galleryBtn.addEventListener("click", () => galleryInput.click());

    // 모바일 사진 용량/로컬 저장 안정성을 위해 리사이즈 압축
    function handleImageFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const maxWidth = 900;
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          currentPhotoDataUrl = canvas.toDataURL("image/jpeg", 0.78);
          currentPhotoName = file.name || "촬영사진.jpg";

          photoPreview.src = currentPhotoDataUrl;
          photoInfo.textContent = `${currentPhotoName} (${width}x${height})`;
          previewBox.style.display = "block";
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    cameraInput.addEventListener("change", (e) => {
      handleImageFile(e.target.files[0]);
      e.target.value = "";
    });

    galleryInput.addEventListener("change", (e) => {
      handleImageFile(e.target.files[0]);
      e.target.value = "";
    });

    removePhotoBtn.addEventListener("click", () => {
      currentPhotoDataUrl = "";
      currentPhotoName = "";
      photoPreview.src = "";
      photoInfo.textContent = "";
      previewBox.style.display = "none";
    });

    function loadItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function renderItems() {
      const items = loadItems();
      if (!items.length) {
        recordList.innerHTML = `<div class="empty-text">등록된 소비기한 내역이 없습니다.</div>`;
        return;
      }

      recordList.innerHTML = items
        .map(
          (item) => `
          <div class="list-item">
            ${
              item.photoDataUrl
                ? `<img src="${item.photoDataUrl}" alt="${item.productQuery}" />`
                : `<div style="width:68px;height:68px;border-radius:8px;background:#1e293b;border:1px solid #334155;display:flex;align-items:center;justify-content:center;font-size:11px;color:#94a3b8;flex-shrink:0;">사진없음</div>`
            }
            <div class="list-content">
              <span class="badge">${escapeHtml(item.category)}</span>
              <div class="item-title">${escapeHtml(item.productQuery)}</div>
              <div class="item-sub">소비기한: <strong>${escapeHtml(item.expiryDate)}</strong> · 수량: ${item.quantity}개</div>
              <div class="item-sub">입고일: ${escapeHtml(item.inboundDate)}${item.location ? ` · 위치: ${escapeHtml(item.location)}` : ""}</div>
              ${item.memo ? `<div class="item-sub">메모: ${escapeHtml(item.memo)}</div>` : ""}
            </div>
            <button type="button" class="btn-danger" onclick="deleteItem('${item.id}')">삭제</button>
          </div>
        `
        )
        .join("");
    }

    window.deleteItem = function (id) {
      const next = loadItems().filter((item) => item.id !== id);
      saveItems(next);
      renderItems();
    };

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const newItem = {
        id: String(Date.now()),
        category: categoryEl.value,
        productQuery: productQueryEl.value.trim(),
        inboundDate: inboundDateEl.value,
        expiryDate: expiryDateEl.value,
        quantity: Number(quantityEl.value || 1),
        location: locationEl.value.trim(),
        memo: memoEl.value.trim(),
        photoDataUrl: currentPhotoDataUrl,
        createdAt: new Date().toISOString()
      };

      const items = loadItems();
      items.unshift(newItem);
      saveItems(items);

      renderItems();
      statusMsg.textContent = "등록되었습니다.";

      // 입력폼 초기화(분류와 입고일은 유지해 연속 등록 편리하게 구성)
      productQueryEl.value = "";
      expiryDateEl.value = "";
      quantityEl.value = "1";
      locationEl.value = "";
      memoEl.value = "";
      removePhotoBtn.click();
      productQueryEl.focus();
    });

    renderItems();
  </script>
</body>
</html>
